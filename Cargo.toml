[workspace]
resolver = "3"
members = ["crates/*", "sources/*"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
lantern-resource = { path = "crates/resource" }
lantern-searcher = { path = "crates/searcher" }
lantern-orchestrator = { path = "crates/orchestrator" }
lantern-showman = { path = "crates/showman" }
lantern-engine = { path = "crates/engine" }
lantern-source-local = { path = "sources/local" }
lantern-source-link = { path = "sources/link" }
lantern-source-clock = { path = "sources/clock" }
lantern-source-text = { path = "sources/text" }
lantern-source-bible = { path = "sources/bible" }
lantern-source-youtube = { path = "sources/youtube" }
lantern-source-brave = { path = "sources/brave" }

# External crates. Keep this list short: every entry is something to audit.
iced = { version = "0.14", features = ["image", "svg", "advanced", "wgpu", "tokio"] }
iced_video_player = "0.6"
gstreamer = "0.23"
gstreamer-app = "0.23"
image = { version = "0.25", default-features = false }
# Watches the media folders, so new files show up without a reindex.
notify = "8"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1"
unicode-normalization = "0.1"
# Blocking HTTPS for the online sources and remote images. Sources are
# blocking by contract, so no async runtime is needed.
ureq = "3"
url = "2.5"
walkdir = "2.5"

# The time of day here, for a plan's start time. Only the local clock.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# An exported plan is one zip file. Stored only: media is compressed already.
zip = { version = "9", default-features = false }

# Dev-only
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
