<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lantern</title>
<style>
:root {
  --ground: #141218; --card: #211f26; --raised: #36343b; --text: #e6e0e9; --dim: #cac4d0;
  --accent: #d0bcff; --on-accent: #381e72; --live: #efb8c8; --danger: #f2b8b5;
  --gap: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground); color: var(--text);
  font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

header { padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.top { display: flex; align-items: center; gap: 10px; }
#plan-name { font-size: 20px; font-weight: 700; color: var(--accent); flex: 1; min-width: 0; }
#link { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); flex: none; }
#link.up { background: var(--accent); }
#notes { display: flex; gap: 6px; flex-wrap: wrap; }
#notes span { background: var(--card); color: var(--dim); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
#notes span:first-child { color: var(--live); }

main { flex: 1; overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: var(--gap); -webkit-overflow-scrolling: touch; scrollbar-width: none; }
main::-webkit-scrollbar { display: none; }
main > * { flex: none; }
.card { background: var(--card); border-radius: 22px; padding: 14px 16px; }

#stage { display: flex; flex-direction: column; gap: 8px; border: 2px solid transparent; }
#stage.on { border-color: var(--live); }
#stage.black { border-color: var(--danger); }
.tag { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  border-radius: 999px; padding: 3px 10px; background: var(--raised); color: var(--dim); }
#stage.on .tag { background: color-mix(in srgb, var(--live) 22%, transparent); color: var(--live); }
#stage.black .tag { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); }
#picture { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 12px; display: block; }
#live-title { font-size: 19px; font-weight: 700; }
#live-facts { color: var(--dim); font-size: 14px; min-height: 1em; }
#live-failed { color: var(--danger); font-size: 14px; }
#timeline { display: flex; align-items: center; gap: 10px; padding-top: 4px; }
#bar { flex: 1; height: 28px; display: flex; align-items: center; touch-action: none; }
#bar div { width: 100%; height: 6px; border-radius: 3px; background: var(--raised); position: relative; }
#bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
#bar b { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--accent); }
#times { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
#next { color: var(--dim); font-size: 14px; padding: 0 6px; }
#next b { color: var(--text); font-weight: 600; }
#resume { align-self: stretch; background: var(--accent); color: var(--on-accent); font-weight: 700; border-radius: 999px; padding: 12px; }

#steps { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.section { color: var(--accent); font-weight: 700; padding: 12px 10px 4px; }
.step { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; border-radius: 14px; text-align: left; width: 100%; }
.step .dot { width: 16px; flex: none; text-align: center; color: var(--dim); font-size: 12px; }
.step .label { flex: 1; min-width: 0; }
.step .detail { color: var(--dim); font-size: 13px; flex: none; }
.step.done { color: var(--dim); opacity: .6; }
.step.current { background: color-mix(in srgb, var(--live) 18%, transparent); color: var(--live); font-weight: 700; }
.step.current .dot, .step.current .detail { color: var(--live); }
.step.picked { background: var(--raised); }
.step .problem { color: var(--danger); }
.step .go { background: var(--accent); color: var(--on-accent); font-weight: 700; border-radius: 999px; padding: 8px 16px; flex: none; }
#empty { color: var(--dim); text-align: center; padding: 28px 12px; }

footer { padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: var(--ground); }
footer button { background: var(--card); border-radius: 18px; height: 52px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
footer button:active, .step:active { filter: brightness(1.25); }
footer svg { width: 22px; height: 22px; fill: currentColor; }
#prev { grid-column: 1; height: 76px; }
#next-step { grid-column: 2 / 4; height: 76px; background: var(--accent); color: var(--on-accent); font-size: 20px; font-weight: 700; }
#black.on { background: var(--danger); color: var(--ground); }
#play:disabled { opacity: .4; }

.icon { width: 40px; height: 40px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; flex: none; }
.icon svg { width: 20px; height: 20px; fill: currentColor; }
.icon.on { background: var(--accent); color: var(--on-accent); }

#search { flex: 1; overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
#search::-webkit-scrollbar { display: none; }
#search > * { flex: none; }
#box { display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--accent); border-radius: 999px; padding: 0 6px 0 16px; height: 50px; }
#query { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 17px; user-select: text; -webkit-user-select: text; }
#query::placeholder { color: var(--dim); opacity: .7; }
#query::-webkit-search-cancel-button { display: none; }
#wipe { width: 38px; height: 38px; border-radius: 50%; color: var(--dim); font-size: 20px; }
#bangs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px; }
#bangs::-webkit-scrollbar { display: none; }
#bangs button { background: var(--card); color: var(--dim); border-radius: 999px; padding: 8px 14px; font-size: 14px; white-space: nowrap; flex: none; }
#bangs button.on { background: var(--accent); color: var(--on-accent); font-weight: 700; }
#bangs b { font-weight: 700; color: var(--accent); margin-right: 6px; }
#bangs button.on b { color: inherit; }
#found { display: flex; flex-direction: column; gap: 10px; }
#found .group { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
#found .name { color: var(--accent); font-weight: 700; font-size: 14px; padding: 6px 10px 2px; }
#found .error { color: var(--danger); font-size: 14px; padding: 4px 10px; }
.hit { display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; border-radius: 14px; text-align: left; width: 100%; }
.hit .title { font-weight: 600; }
.hit .facts { color: var(--dim); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hit.picked { background: var(--raised); }
.hit.picked .facts { -webkit-line-clamp: 6; }
.hit .acts { display: flex; gap: 8px; padding-top: 8px; }
.hit .acts span { flex: 1; text-align: center; border-radius: 999px; padding: 10px; font-weight: 700; background: var(--card); }
.hit .acts .show { background: var(--accent); color: var(--on-accent); }
#hint { color: var(--dim); text-align: center; padding: 20px 12px; }
#ask { align-self: center; background: var(--accent); color: var(--on-accent); font-weight: 700; border-radius: 999px; padding: 12px 28px; }
#said { position: fixed; left: 50%; bottom: calc(170px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--raised); color: var(--text); border-radius: 999px; padding: 10px 18px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 86vw; }
#said.shown { opacity: 1; }

#veil { position: fixed; inset: 0; background: var(--ground); display: none; align-items: center; justify-content: center; text-align: center; padding: 32px; color: var(--dim); }
#veil.shown { display: flex; }
#veil b { display: block; color: var(--text); font-size: 20px; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div id="plan-name" class="one-line">Lantern</div>
    <div id="link" title="Connection"></div>
    <button id="see" class="icon" aria-label="Show the stage's picture"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5M12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.240 5-5 5m0-8c-1.660 0-3 1.340-3 3s1.340 3 3 3 3-1.340 3-3-1.340-3-3-3"/></svg></button>
    <button id="find" class="icon" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg></button>
  </div>
  <div id="notes"></div>
</header>
<section id="search" hidden>
  <div id="box">
    <input id="query" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="A verse, a hymn, a link…">
    <button id="wipe" aria-label="Empty the search">✕</button>
  </div>
  <div id="bangs"></div>
  <div id="found"></div>
</section>
<main>
  <section id="stage" class="card">
    <img id="picture" alt="What the audience sees" hidden>
    <span class="tag" id="live-tag">Stage</span>
    <div id="live-title">Nothing on stage</div>
    <div id="live-facts"></div>
    <div id="live-failed" hidden></div>
    <div id="timeline" hidden>
      <div id="bar"><div><i></i><b></b></div></div>
      <span id="times"></span>
    </div>
  </section>
  <button id="resume" hidden>Back to the plan</button>
  <div id="next" class="one-line" hidden></div>
  <section id="steps" class="card"></section>
</main>
<footer>
  <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
  <button id="next-step">Next<svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4L13.2 12z"/></svg></button>
  <button id="play" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path id="play-icon" d="M8 5v14l11-7z"/></svg></button>
  <button id="black">Blackout</button>
  <button id="clear">Clear</button>
</footer>
<div id="said"></div>
<div id="veil"><div><b id="veil-title"></b><span id="veil-text"></span></div></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get("t") || "";
let state = null;     // the last snapshot
let picked = null;    // the step tapped, waiting for "Show"
let heard = 0;        // when the snapshot arrived, for counting a video on
let dragging = null;  // seconds, while the time bar is held
let finding = false;  // whether the search is open
let hit = null;       // the result tapped, waiting for "Show now" or "Add"
let typed = null;     // the timer that waits for typing to pause
let seeing = false;   // whether the stage's picture is shown
try { seeing = localStorage.getItem("picture") === "1"; } catch (_) {}

function say(words) {
  $("said").textContent = words;
  $("said").classList.add("shown");
  clearTimeout(say.timer);
  say.timer = setTimeout(() => $("said").classList.remove("shown"), 1600);
}
function send(command, quiet) {
  if (!quiet && navigator.vibrate) navigator.vibrate(8);
  fetch("/do?t=" + encodeURIComponent(token), { method: "POST", body: JSON.stringify(command) })
    .catch(() => link(false));
}
function clock(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  const h = Math.floor(seconds / 3600), m = Math.floor(seconds / 60) % 60, s = seconds % 60;
  const two = n => String(n).padStart(2, "0");
  return h ? `${h}:${two(m)}:${two(s)}` : `${m}:${two(s)}`;
}
function veil(title, text) {
  $("veil").classList.toggle("shown", !!title);
  $("veil-title").textContent = title || "";
  $("veil-text").textContent = text || "";
}
function link(up) { $("link").classList.toggle("up", up); }

/* Where a playing video is now: the page counts on from what it was told. */
function position() {
  const t = state && state.live && state.live.timed;
  if (!t) return 0;
  const on = t.playing ? (Date.now() - heard) / 1000 : 0;
  const at = t.position + on;
  return t.length == null ? at : Math.min(at, t.length);
}
function drawTime() {
  const t = state && state.live && state.live.timed;
  $("timeline").hidden = !t;
  if (!t) return;
  const at = dragging == null ? position() : dragging;
  const bar = $("bar");
  bar.style.visibility = t.length ? "visible" : "hidden";
  if (t.length) {
    const part = Math.min(1, at / t.length) * 100 + "%";
    bar.querySelector("i").style.width = part;
    bar.querySelector("b").style.left = part;
  }
  $("times").textContent = t.length == null ? "live" : `${clock(at)} / ${clock(t.length)}`;
}

function draw() {
  const s = state;
  for (const [name, value] of Object.entries(s.colors || {}))
    if (value) document.documentElement.style.setProperty("--" + name.replace("_", "-"), value);
  $("plan-name").textContent = s.plan ? s.plan.name || "Untitled plan" : "Lantern";

  const notes = $("notes");
  notes.replaceChildren(...(s.notes || []).map(note => {
    const chip = document.createElement("span");
    chip.textContent = note;
    return chip;
  }));

  const live = s.live, stage = $("stage");
  stage.classList.toggle("black", s.blackout);
  stage.classList.toggle("on", !!live && !s.blackout);
  $("live-tag").textContent = s.blackout ? "Blackout" : live ? "Live" : "Stage";
  $("live-title").textContent = live ? live.title : "Nothing on stage";
  const facts = live ? [live.facts, live.slides ? `slide ${live.slides.at}${live.slides.of ? " of " + live.slides.of : ""}` : ""].filter(Boolean) : [];
  $("live-facts").textContent = facts.join(" · ");
  $("live-failed").hidden = !(live && live.failed);
  $("live-failed").textContent = live && live.failed ? "Can't show this: " + live.failed : "";
  drawTime();

  const timed = live && live.timed;
  $("play").disabled = !timed;
  $("play-icon").setAttribute("d", timed && timed.playing ? "M6 5h4v14H6zm8 0h4v14h-4z" : "M8 5v14l11-7z");
  $("black").classList.toggle("on", s.blackout);
  $("resume").hidden = !s.off_plan;
  $("next").hidden = !s.next;
  if (s.next) {
    $("next").replaceChildren("Next: ");
    const title = document.createElement("b");
    title.textContent = s.next.title;
    $("next").append(title);
  }
  drawSteps();
  drawSearch();
}

/* The bang a search starts with, without its "!": "b" in "!b juan 3". */
function bangOf(text) {
  const found = /^!(\S+)\s/.exec(text);
  return found ? found[1] : null;
}
function ask(enter) {
  clearTimeout(typed);
  hit = null;
  send({ do: "search", text: $("query").value.trim() ? $("query").value : "", enter: !!enter }, true);
}
function drawSearch() {
  $("search").hidden = !finding;
  document.querySelector("main").hidden = finding;
  $("find").classList.toggle("on", finding);
  if (!finding || !state) return;
  const text = $("query").value, mine = bangOf(text);
  $("bangs").replaceChildren(...(state.bangs || []).map(bang => {
    const chip = document.createElement("button");
    chip.className = bang.bang === mine ? "on" : "";
    const mark = document.createElement("b");
    mark.textContent = "!" + bang.bang;
    chip.append(mark, bang.name);
    chip.onclick = () => {
      const rest = text.replace(/^!\S*\s*/, "");
      $("query").value = bang.bang === mine ? rest : `!${bang.bang} ${rest}`;
      $("query").focus();
      ask(false);
      drawSearch();
    };
    return chip;
  }));

  const box = $("found"), found = state.search;
  const hint = words => {
    const note = document.createElement("div");
    note.id = "hint";
    note.textContent = words;
    return note;
  };
  if (!text.trim()) { box.replaceChildren(hint("Type what to show: a verse (juan 3 16), a hymn, a file's name, a link. A button above searches one kind of thing.")); return; }
  if (!found) { box.replaceChildren(hint("Searching…")); return; }
  const parts = [];
  for (const group of found.groups) {
    if (!group.hits.length && !group.error) continue;
    const card = document.createElement("div");
    card.className = "card group";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = group.name;
    card.append(name);
    if (group.error) {
      const error = document.createElement("div");
      error.className = "error";
      error.textContent = group.error;
      card.append(error);
    }
    for (const result of group.hits) {
      const row = document.createElement("button");
      row.className = "hit" + (result.id === hit ? " picked" : "");
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = result.title;
      const facts = document.createElement("span");
      facts.className = "facts";
      facts.textContent = result.facts;
      row.append(title, facts);
      if (result.id === hit) {
        const acts = document.createElement("span");
        acts.className = "acts";
        const show = document.createElement("span");
        show.className = "show";
        show.textContent = "Show now";
        show.onclick = event => { event.stopPropagation(); send({ do: "show", id: result.id }); say("On stage: " + result.title); hit = null; drawSearch(); };
        const add = document.createElement("span");
        add.textContent = "Add to plan";
        add.onclick = event => { event.stopPropagation(); send({ do: "add", id: result.id }); say("Added to the plan"); hit = null; drawSearch(); };
        acts.append(show, add);
        row.append(acts);
      }
      row.onclick = () => { hit = result.id === hit ? null : result.id; drawSearch(); };
      card.append(row);
    }
    parts.push(card);
  }
  if (found.waiting) {
    const go = document.createElement("button");
    go.id = "ask";
    go.textContent = "Search";
    go.onclick = () => ask(true);
    parts.push(hint("Press Search to look this up."), go);
  } else if (!parts.length) {
    parts.push(hint(found.busy ? "Searching…" : "Nothing found."));
  } else if (found.busy) {
    parts.push(hint("Still searching…"));
  }
  box.replaceChildren(...parts);
}

function drawSteps() {
  const box = $("steps"), plan = state.plan;
  if (!plan || !plan.steps.length) {
    const empty = document.createElement("div");
    empty.id = "empty";
    empty.textContent = plan ? "This plan has no steps yet." : "No plan is open. Next and Previous still move through what is on stage.";
    box.replaceChildren(empty);
    return;
  }
  if (!plan.steps.some(step => step.id === picked)) picked = null;
  let number = 0, current = null;
  box.replaceChildren(...plan.steps.map(step => {
    if (step.kind === "section") {
      const head = document.createElement("div");
      head.className = "section one-line";
      head.textContent = step.label;
      return head;
    }
    number += 1;
    const row = document.createElement("button");
    row.className = `step ${step.place}${step.id === picked ? " picked" : ""}`;
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.textContent = step.place === "current" ? "●" : number;
    const label = document.createElement("span");
    label.className = "label one-line";
    label.textContent = step.label;
    row.append(dot, label);
    if (step.id === picked) {
      const go = document.createElement("span");
      go.className = "go";
      go.textContent = "Show";
      row.append(go);
    } else {
      const detail = document.createElement("span");
      detail.className = "detail" + (step.problem ? " problem" : "");
      detail.textContent = step.problem || step.detail;
      row.append(detail);
    }
    row.onclick = () => {
      if (step.id === picked) { picked = null; send({ do: "go", step: step.id }); }
      else picked = step.id;
      drawSteps();
    };
    if (step.place === "current") current = row;
    return row;
  }));
  // The step on stage stays in sight as the service moves on.
  if (current && current.dataset.seen !== "1" && drawSteps.last !== current.textContent) {
    drawSteps.last = current.textContent;
    current.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

/* The stage's picture: asked for again about once a second while it is
   shown, which is also what has Lantern make it. */
function drawPicture() {
  $("see").classList.toggle("on", seeing);
  if (!seeing) $("picture").hidden = true;
}
function fetchPicture() {
  if (!seeing || finding || document.visibilityState !== "visible" || !token) return;
  const next = new Image();
  next.onload = () => { if (seeing) { $("picture").src = next.src; $("picture").hidden = false; } };
  next.src = `/stage.jpg?t=${encodeURIComponent(token)}&n=${Date.now()}`;
}
$("see").onclick = () => {
  seeing = !seeing;
  try { localStorage.setItem("picture", seeing ? "1" : "0"); } catch (_) {}
  drawPicture();
  fetchPicture();
};
setInterval(fetchPicture, 1000);
drawPicture();

$("find").onclick = () => {
  finding = !finding;
  drawSearch();
  if (finding) $("query").focus();
  else $("query").blur();
};
$("query").oninput = () => {
  clearTimeout(typed);
  typed = setTimeout(() => ask(false), 350);
  drawSearch();
};
$("query").onkeydown = event => {
  if (event.key === "Enter") { ask(true); $("query").blur(); }
};
$("wipe").onclick = () => { $("query").value = ""; ask(false); drawSearch(); $("query").focus(); };

$("prev").onclick = () => send({ do: "prev" });
$("next-step").onclick = () => send({ do: "next" });
$("play").onclick = () => send({ do: "play_pause" });
$("black").onclick = () => send({ do: "blackout" });
$("clear").onclick = () => send({ do: "clear" });
$("resume").onclick = () => send({ do: "resume" });

/* The time bar: hold and slide, let go to jump. */
const bar = $("bar");
function held(event) {
  const t = state && state.live && state.live.timed;
  if (!t || !t.length) return null;
  const box = bar.getBoundingClientRect();
  return Math.max(0, Math.min(1, (event.clientX - box.left) / box.width)) * t.length;
}
bar.onpointerdown = event => { bar.setPointerCapture(event.pointerId); dragging = held(event); drawTime(); };
bar.onpointermove = event => { if (dragging != null) { dragging = held(event); drawTime(); } };
bar.onpointerup = () => {
  if (dragging != null) send({ do: "seek", seconds: dragging });
  dragging = null;
};
bar.onpointercancel = () => { dragging = null; drawTime(); };
setInterval(drawTime, 500);

if (!token) {
  veil("Scan the code again", "This page needs the address from Lantern's settings, under Phone.");
} else {
  veil("Connecting…", "");
  const events = new EventSource("/events?t=" + encodeURIComponent(token));
  let ever = false;
  events.onopen = () => { ever = true; link(true); veil(); };
  events.onmessage = event => { state = JSON.parse(event.data); heard = Date.now(); link(true); veil(); draw(); };
  events.onerror = () => {
    link(false);
    if (!ever) veil("Can't reach Lantern", "Check that the phone is on the same Wi-Fi as the computer, and that the remote is on in Lantern's settings.");
    else if (!state) veil("Reconnecting…", "");
  };
  // An address ending in #q=juan 3 16 opens on that search.
  const start = new URLSearchParams(location.hash.slice(1));
  if (start.get("see")) { seeing = true; drawPicture(); fetchPicture(); }
  if (start.get("q")) {
    finding = true;
    $("query").value = start.get("q");
    hit = start.get("hit");
    events.addEventListener("open", () => send({ do: "search", text: $("query").value }, true), { once: true });
  }
  // Keeps the screen on where the browser allows it.
  const awake = () => navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {});
  awake();
  document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && awake());
}
</script>
