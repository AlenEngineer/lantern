<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lantern</title>
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(/inter-400.ttf) format("truetype"); font-display: swap; }
@font-face { font-family: Inter; font-weight: 500; src: url(/inter-500.ttf) format("truetype"); font-display: swap; }
@font-face { font-family: Inter; font-weight: 700; src: url(/inter-700.ttf) format("truetype"); font-display: swap; }
/* The dashboard's look (docs/DESIGN.md): cards on a darker ground, states
   as tints, solid primary only for play and the timeline. */
:root {
  --surface: #151218; --container: #221e24; --highest: #373339; --on: #e8e0e8; --on-var: #ccc4cf;
  --primary: #dabaf9; --on-primary: #3e2459; --tertiary: #f3b7bf; --error: #ffb4ab;
  --ground: color-mix(in srgb, var(--surface) 62%, #000);
  --outline: color-mix(in srgb, var(--on-var) 70%, var(--surface));
  --outline-var: color-mix(in srgb, var(--on) 25%, var(--surface));
  --t-live: color-mix(in srgb, var(--tertiary) 22%, var(--surface));
  --t-next: color-mix(in srgb, var(--primary) 22%, var(--surface));
  --t-danger: color-mix(in srgb, var(--error) 14%, var(--surface));
  --t-plain: color-mix(in srgb, var(--on) 8%, var(--surface));
  --t-hover: color-mix(in srgb, var(--on) 12%, var(--surface));
  --hair: rgba(255,255,255,.10);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground); color: var(--on); font: 13px/1.35 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; gap: 10px; overflow: hidden; position: relative;
  padding: calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
body > * { flex: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
svg.i { width: 18px; height: 18px; fill: currentColor; flex: none; }
.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.meta { font-size: 12px; color: var(--on-var); }
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 22px; }
.pill { border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; font-weight: 500; white-space: nowrap; }
.chip { border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; font-size: 12px; font-weight: 700; white-space: nowrap; flex: none; }
.live { background: var(--t-live); color: var(--tertiary); }
.next { background: var(--t-next); color: var(--primary); }
.danger { background: var(--t-danger); color: var(--error); }
.plain { background: var(--t-plain); color: var(--on); }
button.pill:active, .go > button:active, .step:active, .res:active { filter: brightness(1.25); }

/* The strip: a pill across the top, as on the computer. */
#strip { height: 48px; border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 8px; position: relative; z-index: 4; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
#plan-name { font-weight: 700; font-size: 16px; flex: 1; }
#link { width: 8px; height: 8px; border-radius: 50%; background: var(--error); flex: none; }
#link.up { display: none; }
#vol-pill.open { background: var(--t-next); color: var(--primary); }
#pace { display: flex; align-items: center; gap: 8px; padding: 0 8px; min-height: 22px; }
#pace-word { margin-left: auto; }

/* Plan mode: nothing to press. */
#planning { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 0 20px 60px; }
#planning svg.i { width: 40px; height: 40px; color: var(--primary); margin-bottom: 6px; }
#planning h1 { margin: 0; font-size: 18px; font-weight: 700; }
#plan-plan { font-size: 15px; font-weight: 700; color: var(--primary); }
#countdown { font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1px; line-height: 1.1; }

/* The stage card. */
#stage { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.pic { aspect-ratio: 16/9; border-radius: 12px; background: #000; position: relative; overflow: hidden; flex: none; }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.pic .over { position: absolute; left: 8px; top: 8px; }
#live-title { font-weight: 700; font-size: 16px; }
#live-failed { color: var(--error); font-size: 12px; }
#time { display: flex; align-items: center; gap: 10px; }
#play { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; flex: none; }
#bar { flex: 1; height: 28px; display: flex; align-items: center; touch-action: none; }
.track { width: 100%; height: 4px; border-radius: 2px; background: var(--highest); position: relative; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--primary); }
.track b { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--primary); }
#times { font-size: 12px; color: var(--on-var); font-variant-numeric: tabular-nums; flex: none; }
#slides { display: flex; gap: 4px; }
#slides span { flex: 1; height: 26px; border-radius: 8px; background: var(--t-plain); font-size: 11px; color: var(--on-var); display: flex; align-items: center; justify-content: center; font-weight: 500; font-variant-numeric: tabular-nums; }
#slides span.on { background: var(--t-live); color: var(--tertiary); font-weight: 700; }
#extras { display: flex; flex-wrap: wrap; gap: 6px; }
#extras .pill { height: 34px; }
/* Small, beside its words: while the menu is up, and in Live. */
body.menu-open #stage, body.in-live #stage { flex-direction: row; align-items: center; padding: 8px; gap: 10px; }
body.menu-open #stage .pic, body.in-live #stage .pic { width: 112px; }
body.menu-open #stage .pic .over, body.in-live #stage .pic .over { display: none; }
body.menu-open #time, body.menu-open #slides, body.menu-open #extras, body.menu-open #live-failed,
body.in-live #time, body.in-live #slides, body.in-live #extras, body.in-live #live-failed { display: none !important; }
#stage-words { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
#stage-chip { display: none; align-self: flex-start; margin-bottom: 2px; }
body.menu-open #stage-chip, body.in-live #stage-chip { display: inline-flex; }
body.menu-open #live-title, body.in-live #live-title { font-size: 13px; }
body.menu-open #pace { display: none !important; }

/* What comes next. */
#upnext { padding: 8px 10px; display: flex; align-items: center; gap: 10px; }
.thumb { width: 64px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, var(--highest), var(--surface)); flex: none; }
#upnext-mark { color: var(--primary); font-weight: 700; }
#upnext-title { font-weight: 700; }

/* Live: tiles, pickers and results, each ending in Send. */
#live { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; padding-bottom: 4px; }
#live::-webkit-scrollbar { display: none; }
#live > * { flex: none; }
#steppers { display: none; flex-direction: column; gap: 4px; margin-left: auto; flex: none; }
body.in-live #steppers { display: flex; }
#steppers button { width: 36px; height: 36px; }
.field { height: 44px; border-radius: 999px; background: var(--container); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; color: var(--on-var); }
.field input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--on); font: inherit; font-size: 16px; user-select: text; -webkit-user-select: text; }
.field input::placeholder { color: var(--on-var); opacity: .8; }
.field input::-webkit-search-cancel-button { display: none; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 104px; }
.tile .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--t-next); color: var(--primary); display: flex; align-items: center; justify-content: center; }
.tile.folder .ic { background: var(--t-plain); color: var(--on-var); }
.tile .ic svg.i { width: 22px; height: 22px; }
.tile .n { font-weight: 700; font-size: 15px; }
.tile .h { margin-top: -6px; }
.label { font-size: 12px; font-weight: 700; color: var(--on-var); padding: 4px 6px 0; }
.again { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 8px; border-radius: 12px; width: 100%; }
.again.on { background: var(--t-live); color: var(--tertiary); font-weight: 700; }
.head { display: flex; align-items: center; gap: 10px; }
.head .round { width: 40px; height: 40px; }
.head b { font-size: 17px; }
.head .meta { margin-left: auto; }
.trail { display: flex; gap: 6px; flex-wrap: wrap; }
.trail .pill { height: 28px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--t-plain); border-radius: 999px; padding: 3px; }
.seg button { height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-weight: 500; color: var(--on-var); font-size: 12px; }
.seg button.on { background: var(--t-next); color: var(--primary); font-weight: 700; }
.grid { display: grid; gap: 5px; }
.grid button { height: 42px; border-radius: 12px; background: var(--t-plain); display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
.grid button.on { background: var(--t-next); color: var(--primary); font-weight: 700; }
.grid button.range { background: color-mix(in srgb, var(--primary) 12%, var(--surface)); color: var(--primary); outline: 1px dashed color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: -3px; }
.words { padding: 10px 12px; border-radius: 12px; background: var(--container); font-size: 13px; line-height: 1.45; max-height: 9.5em; overflow: hidden; }
.words b { color: var(--primary); }
.buttons { display: grid; gap: 6px; }
.buttons button { height: 44px; border-radius: 999px; background: var(--t-plain); font-weight: 500; display: flex; align-items: center; justify-content: center; }
.buttons button.on { background: var(--t-next); color: var(--primary); font-weight: 700; }
.big { padding: 18px; text-align: center; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; border-radius: 16px; background: var(--container); }
textarea { width: 100%; min-height: 110px; resize: none; border-radius: 18px; border: 2px solid color-mix(in srgb, var(--primary) 60%, transparent); background: var(--container); color: var(--on); font: inherit; font-size: 16px; padding: 12px 14px; outline: 0; user-select: text; -webkit-user-select: text; }
.results { padding: 4px; display: flex; flex-direction: column; gap: 1px; }
.results .label { padding: 8px 10px 2px; }
.results .error { color: var(--error); font-size: 12px; padding: 2px 10px 6px; }
/* One result, every kind: a 16:9 picture with its size in the lower
   right and its state in the upper left, then its title and one line. */
.th { position: relative; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; flex: none; display: flex; align-items: center; justify-content: center; background: var(--container); color: var(--on-var); }
.th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.th.words { background: #0b0a0d; color: #fff; font-size: 7px; line-height: 1.35; text-align: center; padding: 6px; }
.th.time { background: #0b0a0d; color: #fff; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.th.sound { background: var(--t-next); color: var(--primary); }
.th svg.i { width: 24px; height: 24px; }
.bd { position: absolute; right: 3px; bottom: 3px; max-width: calc(100% - 6px); overflow: hidden; white-space: nowrap; font-size: 9.5px; font-weight: 700; background: rgba(0,0,0,.74); color: #fff; border-radius: 4px; padding: 1px 4px; font-variant-numeric: tabular-nums; }
.st { position: absolute; left: 3px; top: 3px; font-size: 9.5px; font-weight: 700; border-radius: 999px; padding: 1px 5px; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.st.plain { background: rgba(0,0,0,.74); color: #fff; }
.st.live, .st.waiting { background: color-mix(in srgb, var(--tertiary) 85%, #000); color: #2a1216; }
.st.problem { background: color-mix(in srgb, var(--error) 85%, #000); color: #2a1216; }
.th .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--highest); }
.th .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--primary); }
.line.waiting { color: var(--tertiary); }
.line.problem { color: var(--error); }
.r { display: flex; gap: 10px; padding: 6px; border-radius: 14px; align-items: center; flex-wrap: wrap; }
.r .th { width: 92px; }
.r .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.r .tt { font-weight: 700; }
.r.picked { background: var(--t-plain); }
.r.sent { background: var(--t-live); }
.r.sent .tt { color: var(--tertiary); }
.r .send, .wide { flex-basis: 100%; grid-column: 1 / -1; }
.rhead { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
.views { display: flex; background: var(--t-plain); border-radius: 999px; padding: 3px; margin-left: auto; }
.views button { width: 38px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--on-var); }
.views button.on { background: var(--t-next); color: var(--primary); }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px; padding: 8px; }
.gt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.gt .th { width: 100%; border-radius: 10px; }
.gt .tt { font-weight: 700; font-size: 12px; }
.gt .line { font-size: 11px; margin-top: -2px; }
.gt.picked .th, .jt.picked { outline: 3px solid var(--tertiary); outline-offset: -3px; }
.shapes { padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.jrow { display: flex; gap: 4px; }
.jt { aspect-ratio: auto; border-radius: 10px; flex: none; }
.jt .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 4px; background: linear-gradient(transparent, rgba(0,0,0,.8)); color: #fff; font-size: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.jt .bd { bottom: auto; top: 3px; }
.send { height: 48px; width: 100%; font-weight: 700; font-size: 15px; margin-top: 6px; }
.send svg.i { width: 20px; height: 20px; }
.send:disabled { opacity: .55; }
.hint { color: var(--on-var); text-align: center; padding: 16px 12px; }
.foot { position: sticky; bottom: 0; padding-top: 6px; background: linear-gradient(transparent, var(--ground) 12px); }

/* The transport, in the thumb's reach. */
#transport { margin-top: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 3; touch-action: none; }
#handle { display: flex; align-items: center; justify-content: center; gap: 6px; height: 26px; color: var(--on-var); font-size: 12px; font-weight: 500; position: relative; }
#handle::before { content: ""; width: 32px; height: 4px; border-radius: 2px; background: var(--outline-var); position: absolute; top: -2px; left: 50%; margin-left: -16px; }
#handle svg.i { width: 16px; height: 16px; transition: transform .2s; }
body.menu-open #handle { color: var(--on); }
body.menu-open #handle svg.i { transform: rotate(180deg); }
body.menu-open #transport { border-top-left-radius: 0; border-top-right-radius: 0; border-top-color: transparent; }
#lift { height: 40px; font-weight: 700; }
.go { display: grid; grid-template-columns: 1fr 2.2fr; gap: 6px; }
.go > button { height: 64px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 700; }
.go svg.i { width: 24px; height: 24px; }

/* The menu rises from the transport, as the search drops from the strip
   on the computer: one surface with it, no seam. */
#dim { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 2; opacity: 0; pointer-events: none; transition: opacity .2s; }
body.menu-open #dim, body.vol-open #dim { opacity: 1; pointer-events: auto; }
#menu { position: absolute; left: calc(12px + env(safe-area-inset-left)); right: calc(12px + env(safe-area-inset-right)); top: var(--menu-top, 150px); bottom: var(--menu-bottom, 112px);
  background: var(--surface); border-radius: 22px 22px 0 0; border: 1px solid var(--hair); border-bottom: 0; box-shadow: 0 -12px 28px rgba(0,0,0,.5); z-index: 3;
  padding: 8px; display: flex; flex-direction: column; transform: translateY(24px); opacity: 0; pointer-events: none; transition: transform .2s, opacity .2s; }
body.menu-open #menu { transform: none; opacity: 1; pointer-events: auto; }
#menu-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px 2px 6px; flex: none; }
#menu-acts .pill { height: 40px; }
#steps { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
#steps::-webkit-scrollbar { display: none; }
.sec { display: flex; align-items: center; gap: 8px; padding: 10px 10px 4px; font-weight: 700; color: var(--primary); }
.sec .chip { margin-left: auto; }
.step { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 12px; width: 100%; }
.step .dot { width: 14px; text-align: center; font-size: 11px; color: var(--on-var); flex: none; }
.step .len { margin-left: auto; font-size: 12px; color: var(--on-var); flex: none; }
.step .len.problem { color: var(--error); }
.step.done { color: var(--outline); }
.step.done .dot, .step.done .len { color: var(--outline); }
.step.cur { background: var(--t-live); color: var(--tertiary); font-weight: 700; }
.step.cur .dot, .step.cur .len { color: var(--tertiary); }
.step.nx { background: var(--t-next); color: var(--primary); font-weight: 700; }
.step.nx .dot, .step.nx .len { color: var(--primary); }
.step.picked { background: var(--t-plain); }
.step .pill { height: 28px; margin-left: auto; }
#empty { color: var(--on-var); text-align: center; padding: 24px 12px; }

/* Sound: a panel dropped from the strip's pill. */
#vol { position: absolute; top: calc(12px + env(safe-area-inset-top) + 47px); right: calc(30px + env(safe-area-inset-right)); width: min(250px, calc(100% - 60px));
  background: var(--surface); border-radius: 0 0 22px 22px; box-shadow: 0 16px 28px rgba(0,0,0,.55); z-index: 5; padding: 14px 14px 14px; display: flex; flex-direction: column; gap: 12px;
  transform: translateY(-12px); opacity: 0; pointer-events: none; transition: transform .2s, opacity .2s; }
body.vol-open #vol { transform: none; opacity: 1; pointer-events: auto; }
#vol .sh { position: absolute; top: 0; width: 18px; height: 18px; }
#vol .sh.l { left: -18px; background: radial-gradient(circle at 0 100%, transparent 17.5px, var(--surface) 18px); }
#vol .sh.r { right: -18px; background: radial-gradient(circle at 100% 100%, transparent 17.5px, var(--surface) 18px); }
#vol-head { display: flex; align-items: baseline; gap: 8px; }
#vol-head b { font-size: 16px; }
#vol-out { margin-left: auto; }
#vol-row { display: flex; align-items: center; gap: 10px; }
.round { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
#loud { flex: 1; height: 36px; display: flex; align-items: center; touch-action: none; }
#loud .track { height: 6px; border-radius: 3px; }
#loud .track b { width: 24px; height: 24px; margin: -12px 0 0 -12px; }
#vol.muted #loud .track i, #vol.muted #loud .track b { background: var(--outline); }
#vol-foot { display: flex; gap: 6px; }
#mute { flex: 1; height: 36px; }
#loud-at { height: 36px; font-variant-numeric: tabular-nums; }

#said { position: absolute; left: 50%; transform: translateX(-50%); bottom: 160px; z-index: 6; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 86vw; height: 34px; padding: 0 16px; }
#said.shown { opacity: 1; }
#veil { position: fixed; inset: 0; background: var(--ground); display: none; align-items: center; justify-content: center; text-align: center; padding: 32px; color: var(--on-var); z-index: 9; font-size: 15px; }
#veil.shown { display: flex; }
#veil b { display: block; color: var(--on); font-size: 20px; margin-bottom: 8px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"/></symbol>

<div id="strip" class="card">
  <span id="mode" class="chip plain">Plan</span>
  <span id="plan-name" class="one">Lantern</span>
  <span id="link" title="Not connected"></span>
  <button id="vol-pill" class="pill plain" hidden><svg class="i"><use id="vol-icon" href="#i-vol"/></svg><span id="vol-at"></span></button>
</div>
<div id="pace" hidden><span id="pace-text" class="meta one"></span><span id="pace-word" class="chip" hidden></span></div>

<section id="planning" hidden>
  <svg class="i"><use href="#i-planning"/></svg>
  <h1>The computer is planning</h1>
  <div id="plan-plan" class="one"></div>
  <div id="plan-start" class="meta"></div>
  <div id="countdown" hidden></div>
  <div class="meta">This becomes the remote when the service runs.</div>
</section>

<section id="stage" class="card">
  <div class="pic"><img id="picture" alt="What the audience sees" hidden><span id="stage-tag" class="chip over live">● live</span></div>
  <div id="stage-words">
    <span id="stage-chip" class="chip live">● live</span>
    <div id="live-title" class="one">Nothing on stage</div>
    <div id="live-facts" class="meta one"></div>
  </div>
  <div id="live-failed" hidden></div>
  <div id="time" hidden>
    <button id="play" aria-label="Play or pause"><svg class="i"><use id="play-icon" href="#i-pause"/></svg></button>
    <div id="bar"><div class="track"><i></i><b></b></div></div>
    <span id="times"></span>
  </div>
  <div id="slides" hidden></div>
  <div id="extras" hidden></div>
  <div id="steppers">
    <button id="step-up" class="round plain" aria-label="Back a slide"><svg class="i"><use href="#i-up"/></svg></button>
    <button id="step-down" class="round next" aria-label="On a slide"><svg class="i" style="transform:rotate(180deg)"><use href="#i-up"/></svg></button>
  </div>
</section>

<section id="upnext" class="card" hidden>
  <div class="thumb"></div>
  <div class="one" style="flex:1">
    <div id="upnext-mark" class="meta">○ Next</div>
    <div id="upnext-title" class="one"></div>
  </div>
  <span id="upnext-detail" class="meta"></span>
</section>

<section id="live" hidden></section>

<div id="dim"></div>
<section id="menu" aria-label="The plan">
  <div id="menu-acts">
    <button id="black" class="pill danger">Blackout</button>
    <button id="clear" class="pill plain">Clear</button>
  </div>
  <div id="steps"></div>
</section>

<section id="transport" class="card">
  <button id="handle"><svg class="i"><use href="#i-up"/></svg><span id="handle-text">Plan</span></button>
  <button id="lift" class="pill danger" hidden>Blackout on · Lift</button>
  <div class="go">
    <button id="prev" class="plain" aria-label="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
    <button id="next-step" class="next">Next<svg class="i"><use href="#i-next"/></svg></button>
  </div>
</section>

<section id="vol" aria-label="Sound">
  <span class="sh l"></span><span class="sh r"></span>
  <div id="vol-head"><b>Sound</b><span id="vol-out" class="meta one"></span></div>
  <div id="vol-row">
    <button id="softer" class="round plain" aria-label="Softer"><svg class="i"><use href="#i-minus"/></svg></button>
    <div id="loud" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100"><div class="track"><i></i><b></b></div></div>
    <button id="louder" class="round plain" aria-label="Louder"><svg class="i"><use href="#i-plus"/></svg></button>
  </div>
  <div id="vol-foot">
    <button id="mute" class="pill danger"><svg class="i"><use href="#i-mute"/></svg><span id="mute-text">Mute</span></button>
    <span id="loud-at" class="pill plain"></span>
  </div>
</section>

<div id="said" class="pill plain"></div>
<div id="veil"><div><b id="veil-title"></b><span id="veil-text"></span></div></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get("t") || "";
let state = null;     // the last snapshot
let heard = 0;        // when it arrived, for counting a video or a start on
let picked = null;    // the step tapped in the menu, waiting for "Show now"
let dragging = null;  // seconds, while the time bar is held
let hit = null;       // the result tapped, waiting for Send
let typed = null;     // the timer that waits for typing to pause
let loud = 0;         // the volume the slider shows, 0 to 1
let loudHeld = false; // whether the volume slider is held
let loudLet = 0;      // when it was let go: the computer says so a moment later
let loudSent = 0;     // when a volume was last sent

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
};
function say(words) {
  $("said").textContent = words;
  $("said").style.bottom = $("transport").offsetHeight + 24 + "px";
  $("said").classList.add("shown");
  clearTimeout(say.timer);
  say.timer = setTimeout(() => $("said").classList.remove("shown"), 1600);
}
function send(command, quiet) {
  if (!quiet && navigator.vibrate) navigator.vibrate(8);
  fetch("/do?t=" + encodeURIComponent(token), { method: "POST", body: JSON.stringify(command) })
    .catch(() => link(false));
}
function clock(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  const h = Math.floor(seconds / 3600), m = Math.floor(seconds / 60) % 60, s = seconds % 60;
  const two = n => String(n).padStart(2, "0");
  return h ? `${h}:${two(m)}:${two(s)}` : `${m}:${two(s)}`;
}
function veil(title, text) {
  $("veil").classList.toggle("shown", !!title);
  $("veil-title").textContent = title || "";
  $("veil-text").textContent = text || "";
}
function link(up) { $("link").classList.toggle("up", up); }
const mode = () => (state && state.mode) || "plan";

/* Where a playing video is now: the page counts on from what it was told. */
function position() {
  const t = state && state.live && state.live.timed;
  if (!t) return 0;
  const on = t.playing ? (Date.now() - heard) / 1000 : 0;
  const at = t.position + on;
  return t.length == null ? at : Math.min(at, t.length);
}
function drawTime() {
  const t = state && state.live && state.live.timed;
  $("time").hidden = !t;
  if (!t) return;
  const at = dragging == null ? position() : dragging;
  const track = $("bar").querySelector(".track");
  track.style.visibility = t.length ? "visible" : "hidden";
  if (t.length) {
    const part = Math.min(1, at / t.length) * 100 + "%";
    track.querySelector("i").style.width = part;
    track.querySelector("b").style.left = part;
  }
  $("times").textContent = t.length == null ? "live" : `${clock(at)} / ${clock(t.length)}`;
  $("play-icon").setAttribute("href", t.playing ? "#i-pause" : "#i-play");
}
function drawCountdown() {
  const starts = state && state.starts;
  const left = starts && starts.in_seconds != null ? starts.in_seconds - (Date.now() - heard) / 1000 : null;
  $("plan-start").textContent = !starts ? "No start time set" : left != null && left > 0 ? `Starts at ${starts.at}` : `Was to start at ${starts.at}`;
  $("countdown").hidden = !(left > 0);
  if (left > 0) $("countdown").textContent = clock(left);
}

function draw() {
  const s = state, m = mode();
  const colors = s.colors || {};
  const role = { ground: "surface", card: "container", raised: "highest", text: "on", dim: "on-var", accent: "primary", on_accent: "on-primary", live: "tertiary", danger: "error" };
  for (const [name, value] of Object.entries(colors))
    if (value && role[name]) document.documentElement.style.setProperty("--" + role[name], value);
  const planning = m === "plan";
  document.body.classList.toggle("in-live", m === "live");
  if (planning) { closeMenu(); closeVol(); }

  $("mode").textContent = m === "run" ? "Run" : m === "live" ? "Live" : "Plan";
  $("mode").className = "chip " + (m === "run" ? "live" : m === "live" ? "danger" : "plain");
  $("plan-name").textContent = s.plan ? s.plan.name || "Untitled plan" : "Lantern";
  $("planning").hidden = !planning;
  $("plan-plan").textContent = s.plan ? s.plan.name || "Untitled plan" : "";
  drawCountdown();
  $("stage").hidden = planning;
  for (const id of ["transport", "menu", "dim"]) $(id).hidden = m !== "run";
  if (m !== "run") closeMenu();
  if (m !== "live" && built) { built = null; view = { screen: "home" }; }
  $("upnext").hidden = planning || m === "live" || !s.next;
  $("live").hidden = m !== "live";

  const notes = s.notes || [];
  $("pace").hidden = planning || m === "live" || !notes.length;
  $("pace-text").textContent = notes.map(note => note.text).join(" · ");
  const worst = notes.some(note => note.pace === "over") ? "over" : notes.some(note => note.pace === "tight") ? "tight" : null;
  $("pace-word").hidden = !worst;
  $("pace-word").textContent = worst || "";
  $("pace-word").className = "chip " + (worst === "over" ? "danger" : "live");

  const live = s.live;
  const tag = s.blackout ? ["blackout", "danger"] : live ? ["● live", "live"] : ["empty", "plain"];
  for (const id of ["stage-tag", "stage-chip"]) {
    $(id).textContent = tag[0];
    $(id).className = `chip ${id === "stage-tag" ? "over " : ""}${tag[1]}`;
  }
  $("picture").style.visibility = s.blackout ? "hidden" : "visible";
  $("live-title").textContent = live ? live.title : "Nothing on stage";
  $("live-facts").textContent = live ? live.facts : "";
  $("live-facts").hidden = !(live && live.facts);
  $("live-failed").hidden = !(live && live.failed);
  $("live-failed").textContent = live && live.failed ? "Can't show this: " + live.failed : "";
  drawTime();
  drawSlides(live && !live.timed ? live.slides : null);
  drawExtras();

  $("lift").hidden = !s.blackout;
  $("black").textContent = s.blackout ? "Lift the blackout" : "Blackout";
  if (s.next) {
    $("upnext-title").textContent = s.next.title;
    $("upnext-detail").textContent = s.next.detail || "";
  }
  drawSound();
  drawSteps();
  drawLive();
  placeMenu();
}

/* A deck's slides as a row of numbers, the one on stage in its tint;
   a long deck shows the few around it. */
function drawSlides(slides) {
  $("slides").hidden = !(slides && slides.of && slides.of > 1);
  if ($("slides").hidden) return;
  const most = 9, of = slides.of, at = slides.at;
  const first = Math.max(1, Math.min(at - Math.floor(most / 2), of - most + 1));
  const numbers = [];
  for (let n = first; n <= Math.min(of, first + most - 1); n++) numbers.push(n);
  $("slides").replaceChildren(...numbers.map(n => el("span", n === at ? "on" : "", n)));
}

/* What the slide on stage plays or links to, the way back to the deck,
   and the way back to the plan. */
function drawExtras() {
  const s = state, live = s.live;
  const parts = [];
  for (const [n, name] of (live && !s.blackout ? live.attached || [] : []).entries()) {
    const button = el("button", "pill plain");
    button.innerHTML = `<svg class="i"><use href="#${name.startsWith("Picture") ? "i-picture" : "i-attach"}"/></svg>`;
    button.append(name);
    button.onclick = () => { send({ do: "attachment", n }); say("On stage: " + name); };
    parts.push(button);
  }
  if (live && live.back) {
    const back = el("button", "pill plain", "Back to slide " + live.back);
    back.onclick = () => send({ do: "prev" });
    parts.push(back);
  }
  if (s.off_plan) {
    const resume = el("button", "pill next", "Back to the plan");
    resume.onclick = () => send({ do: "resume" });
    parts.push(resume);
  }
  $("extras").hidden = !parts.length;

/* The plan in the menu, with the desktop's markers. */
function drawSteps() {
  const box = $("steps"), plan = state.plan;
  const steps = plan ? plan.steps.filter(step => step.kind !== "section") : [];
  const at = steps.findIndex(step => step.place === "current");
  $("handle-text").textContent = document.body.classList.contains("menu-open") ? "Close"
    : !steps.length ? "Plan" : at >= 0 ? `Plan · step ${at + 1} of ${steps.length}` : `Plan · ${steps.length} steps`;
  if (!steps.length) {
    box.replaceChildren(el("div", "", plan ? "This plan has no steps yet." : "No plan is open. Next and Prev still move through what is on stage."));
    box.firstChild.id = "empty";
    return;
  }
  if (!plan.steps.some(step => step.id === picked)) picked = null;
  const next = at >= 0 ? steps[at + 1] : steps.find(step => step.place === "ahead");
  let number = 0, current = null;
  box.replaceChildren(...plan.steps.map(step => {
    if (step.kind === "section") {
      const head = el("div", "sec");
      head.append(el("span", "one", step.label));
      const word = step.pace === "over" ? "over" : step.pace === "tight" ? "tight" : step.detail;
      if (word) head.append(el("span", "chip " + (step.pace === "over" ? "danger" : step.pace === "tight" ? "live" : "plain"), word));
      return head;
    }
    number += 1;
    const place = step.place === "current" ? "cur" : step === next ? "nx" : step.place === "done" ? "done" : "";
    const row = el("button", `step ${place}${step.id === picked ? " picked" : ""}`);
    row.append(el("span", "dot", place === "cur" ? "●" : place === "nx" ? "○" : number), el("span", "one", step.label));
    if (step.id === picked) {
      const go = el("span", "pill live", "Show now");
      row.append(go);
    } else {
      row.append(el("span", "len" + (step.problem ? " problem" : ""), step.problem || step.detail));
    }
    row.onclick = () => {
      if (step.id === picked) { picked = null; send({ do: "go", step: step.id }); say("On stage: " + step.label); }
      else picked = step.id;
      drawSteps();
    };
    if (place === "cur") current = row;
    return row;
  }));
  // The step on stage stays in sight as the service moves on.
  if (current && drawSteps.last !== current.textContent) {
    drawSteps.last = current.textContent;
    current.scrollIntoView({ block: "center" });
  }
}

/* The menu sits between the small stage card and the transport. */

  document.body.style.setProperty("--menu-top", top + "px");

}
function openMenu() {

/* The computer's volume. The slider shows where it is held, and for a
   moment after it is let go, until the computer has caught up. */
function drawSound() {
  const sound = state && state.sound;
  $("vol-pill").hidden = !sound || mode() === "plan";
  if (!sound) { closeVol(); return; }
  if (!loudHeld && Date.now() - loudLet > 1500) loud = Math.max(0, Math.min(1, sound.volume));
  const muted = sound.muted && !loudHeld;
  const part = loud * 100 + "%";
  $("loud").querySelector("i").style.width = part;
  $("loud").querySelector("b").style.left = part;
  $("loud").setAttribute("aria-valuenow", Math.round(loud * 100));

  $("vol-at").textContent = muted ? "muted" : Math.round(loud * 100) + "%";
  $("loud-at").textContent = Math.round(loud * 100) + "%";
  $("vol-pill").className = "pill " + (muted ? "danger" : "plain") + (document.body.classList.contains("vol-open") ? " open" : "");
  $("vol-icon").setAttribute("href", muted ? "#i-mute" : "#i-vol");

}

$("mute").onclick = () => {

function stepLoud(by) {

  loudLet = Date.now();
  sendLoud(true);
  drawSound();

$("softer").onclick = () => stepLoud(-0.05);
$("louder").onclick = () => stepLoud(0.05);

/* The volume: it follows the finger, a few times a second, and lands
   where it is let go. */
const loudBar = $("loud");
function loudAt(event) {
  const box = loudBar.getBoundingClientRect();
  return Math.max(0, Math.min(1, (event.clientX - box.left) / box.width));
}
function sendLoud(last) {
  if (!last && Date.now() - loudSent < 120) return;
  loudSent = Date.now();
  send({ do: "volume", level: Math.round(loud * 100) / 100 }, !last);
}
loudBar.onpointerdown = event => {
  loudBar.setPointerCapture(event.pointerId);

  loud = loudAt(event);
  sendLoud(false);

  loud = loudAt(event);

loudBar.onpointerup = loudBar.onpointercancel = () => {
  if (!loudHeld) return;

/* Live: a tile for each source, then a picker made for fingers. Whatever
   is picked opens Send: a tap sends it, holding it lines it up instead.
   Inputs are made once per screen so typing survives each snapshot. */
let view = { screen: "home" };
let asked = "";        // the search last sent, bang and all
let built = null;      // the screen the inputs were made for
const ICONS = { bible: "i-book", folder: "i-folder", youtube: "i-yt", text: "i-text", time: "i-clock", images: "i-picture" };
const icon = (name, cls) => { const span = el("span", cls); span.innerHTML = `<svg class="i"><use href="#${name}"/></svg>`; return span; };

function seek(text, enter) {
  clearTimeout(typed);
  if (text === asked && !enter) return;
  asked = text;
  send({ do: "search", text, enter: !!enter }, true);
  if (state) drawLive();
}
function seekSoon(text) { clearTimeout(typed); typed = setTimeout(() => seek(text), 350); }
function browseSoon() { clearTimeout(typed); typed = setTimeout(() => send({ do: "browse", folder: view.source.folder, filter: view.filter || "" }, true), 250); }
function answer() { const found = state.search; return found && found.text === asked ? found : null; }
function answers() { const found = answer(); return found ? found.groups.flatMap(group => group.hits) : []; }

function sendIt(result) { send({ do: "show", id: result.id }); say("On stage: " + result.title); hit = null; drawLive(); }
function lineUp(result) { send({ do: "line_up", id: result.id }); say("Lined up next: " + result.title); }
function holdable(node, tap, hold) {
  let timer = null, held = false;
  node.addEventListener("pointerdown", () => {

    timer = setTimeout(() => { held = true; if (navigator.vibrate) navigator.vibrate(20); hold(); }, 550);
  });
  for (const end of ["pointerup", "pointercancel", "pointerleave"]) node.addEventListener(end, () => clearTimeout(timer));
  node.addEventListener("contextmenu", event => event.preventDefault());

function sendButton(result, waiting) {

  button.append(result ? "Send to the stage" : waiting || "Pick something to send");
  button.disabled = !result;

/* Results, one way for every kind and every source, in the layout kept

const LAYOUTS = [["list", "v-list"], ["grid", "v-grid"], ["shapes", "v-shape"]];
function layoutOf(key) {
  try { return localStorage.getItem("layout:" + key) || "list"; } catch (_) { return "list"; }
}
function resultsHead(key, count) {
  const bar = el("div", "rhead");
  bar.append(el("span", "meta", count === 1 ? "1 result" : `${count} results`));
  const views = el("div", "views");
  for (const [name, glyph] of LAYOUTS) {
    const button = el("button", layoutOf(key) === name ? "on" : "");
    button.setAttribute("aria-label", name);
    button.innerHTML = `<svg class="i"><use href="#${glyph}"/></svg>`;
    button.onclick = () => { try { localStorage.setItem("layout:" + key, name); } catch (_) {} drawLive(); };
    views.append(button);

  bar.append(views);
  return bar;
}
function picture(result, cls) {
  const kind = result.kind || "other";
  const box = el("div", "th " + (cls || ""));
  if (result.picture) {
    const img = el("img");
    img.src = `/thumb.jpg?t=${encodeURIComponent(token)}&id=${encodeURIComponent(result.id)}`;
    img.alt = "";
    box.append(img);
  } else if (kind === "passage" || kind === "text") {
    box.classList.add("words");
    box.textContent = (result.text || result.title).split(/\n\s*\n/)[0].slice(0, 90);
  } else if (kind === "time") {
    box.classList.add("time");
    box.textContent = result.size || result.title.replace(/^\D+/, "");
  } else {
    if (kind === "sound") box.classList.add("sound");
    box.innerHTML = `<svg class="i"><use href="#${{ sound: "i-music", video: "i-yt", picture: "i-picture", web: "i-cloud" }[kind] || "i-file"}"/></svg>`;
  }
  if (result.state) {
    const badge = el("span", "st " + result.state.tone, result.state.text);
    box.append(badge);
  }
  if (result.size && kind !== "time") box.append(el("span", "bd", result.size));
  if (result.progress != null) {
    const bar = el("span", "bar"), part = el("i");

function lineOf(result, cls) {

}
const onStage = result => result.state && result.state.tone === "live" && /●/.test(result.state.text) && state.live && state.live.title === result.title;
function pickable(node, result) {

}
function results(hits, key) {
  const layout = layoutOf(key);
  if (layout === "grid") {
    const grid = el("div", "g2");
    hits.forEach((result, n) => {
      const tile = el("div", "gt" + (result.id === hit ? " picked" : ""));
      tile.append(picture(result), el("span", "tt one", result.title), lineOf(result, ""));
      pickable(tile, result);
      grid.append(tile);
      const pickedHere = [hits[n - (n % 2)], hits[n - (n % 2) + 1]].some(h => h && h.id === hit);
      if (pickedHere && (n % 2 === 1 || n === hits.length - 1)) {
        const picked = hits.find(h => h.id === hit);
        const bar = sendButton(picked);
        bar.classList.add("wide");

      if (!row.length) return;
      const sum = row.reduce((total, r) => total + ratio(r), 0);
      const height = last ? Math.min(tall, (width - gap * (row.length - 1)) / sum) : (width - gap * (row.length - 1)) / sum;
      const line = el("div", "jrow");
      for (const result of row) {

    const row = el("div", "r" + (result.id === hit ? " picked" : "") + (onStage(result) ? " sent" : ""));
    const words = el("div", "tx");

function go(screen, extra) {

/* Each screen: `top` makes what holds typing, once; `body` the rest, on

const SCREENS = {

const withBang = text => (view.bang ? `!${view.bang} ` : "") + text;

function open(source) {
  if (source.kind === "bible") go("bible", { book: null, chapter: null, first: null, last: null, nt: true });
  else if (source.kind === "folder") { go("folder", { source, filter: "" }); send({ do: "browse", folder: source.folder, filter: "" }, true); }
  else if (source.kind === "text") go("text", { text: "" });
  else if (source.kind === "time") go("time", {});
  else go("find", { title: source.name, bang: source.bang, text: "" });
}

/* The Bible by touch: book, then chapter, then verse, each grid sized
   from the translation. A passage is two taps, first verse and last. */
function bibleBody() {
  const bible = state.bible;
  if (!bible) return [head("Bible"), el("div", "hint", "No Bible is set up in Lantern's library.")];
  const book = view.book == null ? null : bible.books[view.book];
  const grid = (columns, numbers, cls, tap) => {
    const box = el("div", "grid");
    box.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
    for (const n of numbers) {
      const button = el("button", cls(n), n);
      button.onclick = () => tap(n);
      box.append(button);
    }
    return box;
  };
  if (book && view.chapter) {
    const count = book.verses[view.chapter - 1] || 0;
    const [a, b] = [view.first, view.last];
    const parts = [head(`${book.name} ${view.chapter}`, `${count} verses`, () => { view.chapter = null; view.first = view.last = null; seek(""); drawLive(); })];
    const numbers = Array.from({ length: count }, (_, n) => n + 1);
    parts.push(grid(7, numbers, n => n === a || n === b ? "on" : a && b && n > a && n < b ? "range" : "", n => {
      if (a == null || a !== b) view.first = view.last = n;
      else [view.first, view.last] = [Math.min(a, n), Math.max(a, n)];
      seek(`!b ${book.name} ${view.chapter}:${view.first}${view.last > view.first ? "-" + view.last : ""}`);
      drawLive();
    }));
    if (a) {
      const result = answers()[0];
      const words = el("div", "words");
      const verses = result && result.text ? result.text.split(/\n\s*\n/) : [];
      verses.forEach((verse, n) => { words.append(el("b", null, `${a + n} `), verse + " "); });
      if (verses.length) parts.push(words);
      const span = b > a ? `${a}–${b}` : `${a}`, slides = b - a + 1;
      parts.push(el("div", "meta", `Tap one verse, or two for a passage: ${span} · ${slides === 1 ? "1 slide" : slides + " slides"}`));
      const foot = el("div", "foot");
      foot.append(sendButton(result, "Finding it…"));
      parts.push(foot);
    } else parts.push(el("div", "meta", "Tap one verse, or two for a passage."));
    return parts;
  }
  const parts = [head("Bible", bible.name)];
  if (book) {
    const trail = el("div", "trail");
    const pill = el("button", "pill next", book.name);
    pill.onclick = () => { view.book = null; drawLive(); };
    trail.append(pill, el("span", "pill plain", "chapter"));
    parts.push(trail);
  }
  const seg = el("div", "seg");
  for (const [name, nt] of [["Old Testament", false], ["New Testament", true]]) {
    const button = el("button", view.nt === nt ? "on" : "", name);
    button.onclick = () => { view.nt = nt; drawLive(); };
    seg.append(button);
  }
  parts.push(seg);
  const shown = bible.books.map((b, n) => [b, n]).filter(([b, n]) => (n >= 39) === view.nt && b.verses.length);
  const books = el("div", "grid");
  books.style.gridTemplateColumns = "repeat(5, 1fr)";
  for (const [b, n] of shown) {
    const button = el("button", n === view.book ? "on" : "", b.short);
    button.onclick = () => { view.book = n; view.chapter = null; drawLive(); };
    books.append(button);
  }
  parts.push(books);
  if (book) {
    parts.push(el("div", "label", `${book.name} · chapter`));
    parts.push(grid(7, book.verses.map((_, n) => n + 1), () => "", n => { view.chapter = n; view.first = view.last = null; drawLive(); $("live").scrollTop = 0; }));
  }
  return parts;
}

function drawLive() {
  if (mode() !== "live" || !state) return;
  const screen = SCREENS[view.screen];
  const box = $("live");
  if (built !== view.screen) {
    box.replaceChildren(...screen.top(), el("div", "live-body"));
    built = view.screen;
  }
  const body = box.querySelector(".live-body");
  body.style.display = "contents";
  body.replaceChildren(...screen.body());
}

/* The stage's picture, asked for again about once a second while the
   remote shows it, which is also what has Lantern make it. */
function fetchPicture() {
  if (mode() === "plan" || document.visibilityState !== "visible" || !token) return;
  const next = new Image();
  next.onload = () => { $("picture").src = next.src; $("picture").hidden = false; };
  next.src = `/stage.jpg?t=${encodeURIComponent(token)}&n=${Date.now()}`;
}
setInterval(fetchPicture, 1000);

$("prev").onclick = () => send({ do: "prev" });
$("step-up").onclick = () => send({ do: "prev" });
$("step-down").onclick = () => send({ do: "next" });
$("next-step").onclick = () => send({ do: "next" });
$("play").onclick = () => send({ do: "play_pause" });
$("black").onclick = () => { send({ do: "blackout" }); closeMenu(); };
$("clear").onclick = () => { send({ do: "clear" }); closeMenu(); };
$("lift").onclick = () => send({ do: "blackout" });

/* The time bar: hold and slide, let go to jump. */
const bar = $("bar");
function held(event) {
  const t = state && state.live && state.live.timed;
  if (!t || !t.length) return null;
  const box = bar.getBoundingClientRect();
  return Math.max(0, Math.min(1, (event.clientX - box.left) / box.width)) * t.length;
}
bar.onpointerdown = event => { bar.setPointerCapture(event.pointerId); dragging = held(event); drawTime(); };
bar.onpointermove = event => { if (dragging != null) { dragging = held(event); drawTime(); } };
bar.onpointerup = () => {
  if (dragging != null) send({ do: "seek", seconds: dragging });
  dragging = null;
};
bar.onpointercancel = () => { dragging = null; drawTime(); };
setInterval(() => { drawTime(); drawCountdown(); }, 500);

if (!token) {
  veil("Scan the code again", "This page needs the address from Lantern's settings, under Phone.");
} else {
  veil("Connecting…", "");
  const events = new EventSource("/events?t=" + encodeURIComponent(token));
  let ever = false;
  events.onopen = () => { ever = true; link(true); veil(); };
  events.onmessage = event => { state = JSON.parse(event.data); heard = Date.now(); link(true); veil(); draw(); };
  events.onerror = () => {
    link(false);
    if (!ever) veil("Can't reach Lantern", "Check that the phone is on the same Wi-Fi as the computer, and that the remote is on in Lantern's settings.");
    else if (!state) veil("Reconnecting…", "");
  };
  // An address ending in #q=juan 3 16 opens Live on that search; #menu
  // or #sound opens that panel.
  const start = new URLSearchParams(location.hash.slice(1));
  if (start.get("q")) events.addEventListener("message", () => {
    go("find", { text: start.get("q"), title: "Search everything", bang: "" });
    seek(start.get("q"));
  }, { once: true });
  if (start.has("menu")) events.addEventListener("message", () => openMenu(), { once: true });
  if (start.has("sound")) events.addEventListener("message", () => $("vol-pill").click(), { once: true });
  // Keeps the screen on where the browser allows it.
  const awake = () => navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {});
  awake();
  document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && awake());
}
</script>
</body>
</html>
