name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it builds anything.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The whole workspace, app included.
  linux:
    name: fmt, clippy, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # The app on Windows, with GStreamer's MSVC build: it compiles, its
  # lints hold and its tests pass there too.
  windows:
    name: app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p lantern-app --all-targets
      - run: cargo test -p lantern-app

  # The engine stays portable, on macOS as well. The app needs GStreamer;
  # it is built on Linux and Windows.
  engine:
    name: clippy, test engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude lantern-app --all-targets
      - run: cargo test --workspace --exclude lantern-app

  # The app as it is installed, built once here so the machine it runs on
  # does not have to: the landing script downloads it after the merge.
  binary:
    name: release binary (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release -p lantern-app
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-linux
          path: target/release/lantern
          retention-days: 14

  msrv:
    name: minimum supported Rust (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # A feat or fix PR says what changed for the operator, so the release PR
  # can work out the version and notes. See scripts/check-changelog.sh.
  changelog:
    name: changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/test-release.sh
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-changelog.sh "$BASE" "$TITLE"
