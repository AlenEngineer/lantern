name: Changelog

# A PR that changes the code (crates/, sources/) adds a line under the
# CHANGELOG's ## [Unreleased], or carries the no-changelog label when
# nobody would notice it (a refactor, tests). See
# scripts/check-changelog.sh. Its own workflow, so adding or removing a
# label re-runs only this check. A release PR (scripts/release.sh) moves
# those lines under its version, and they become the release's notes.
on:
  pull_request:
    # edited: a stacked PR moved onto main is checked against main.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# Labels flipped quickly: only the last run counts.
concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: changelog entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/test-release.sh
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') && '1' || '' }}
        run: scripts/check-changelog.sh "$BASE"
