name: Release

# Publishes a GitHub release with a Linux and a Windows build and that
# version's CHANGELOG section: when a tag like v0.2.0 is pushed (scripts/release.sh
# by hand), or when the release PR's workflow calls it after tagging (a tag
# pushed from a workflow doesn't start other workflows).
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to publish, like v0.4.0.
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # lantern.exe with GStreamer and poppler beside it, zipped
  # (scripts/windows/package.ps1).
  windows:
    needs: ci
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/windows-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: ./.github/actions/windows-package
        with:
          name: lantern-${{ env.VERSION }}-x86_64-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: lantern-*-x86_64-windows.zip*

  release:
    needs: [ci, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: The tag matches the workspace version
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lantern-app") | .version')
          [[ "v$crate" == "$VERSION" ]] || { echo "tag $VERSION, Cargo.toml $crate" >&2; exit 1; }
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p lantern-app
      - name: Package
        run: |
          name=lantern-$VERSION-x86_64-linux
          mkdir "$name"
          cp target/release/lantern README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="${VERSION#v}" '
            /^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next }
            on' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file notes.md lantern-*.tar.gz* lantern-*.zip*
