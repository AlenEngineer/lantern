name: Release

# Releases on main whenever Cargo.toml's version has no tag yet: a release
# PR (scripts/release.sh) set it and gave CHANGELOG.md its section. Then CI
# runs again, the Linux and Windows builds are made, and the vX.Y.Z tag
# and GitHub release are created on that commit, with that version's
# CHANGELOG section as its notes. Any other push to main stops at plan.
# (A tag made from a workflow starts no other workflow, so this one does
# the whole release.)
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: scripts/release-check.sh

  ci:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  # lantern.exe with GStreamer and poppler beside it, zipped
  # (scripts/windows/package.ps1).
  windows:
    needs: [plan, ci]
    runs-on: windows-latest
    env:
      VERSION: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: ./.github/actions/windows-package
        with:
          name: lantern-${{ env.VERSION }}-x86_64-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: lantern-*-x86_64-windows.zip*

  release:
    needs: [plan, ci, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p lantern-app -p lantern-web
      - name: Package
        run: |
          name=lantern-$VERSION-x86_64-linux
          mkdir "$name"
          cp target/release/lantern target/release/lantern-web README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE crates/app/fonts/Inter-LICENSE.txt "$name"/
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="${VERSION#v}" '
            /^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next }
            on' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
      # Creates the tag on this commit too.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes-file notes.md lantern-*.tar.gz* lantern-*.zip*
